<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meu Saldo Real | Área de Membros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 520px;
  margin: auto;
  background: #020617;
  padding: 24px;
  border-radius: 12px;
}
h1, h2 {
  color: #38bdf8;
}
p {
  line-height: 1.5;
}
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  font-size: 16px;
  background: #38bdf8;
  color: #020617;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
.resultado {
  margin-top: 24px;
  background: #020617;
  padding: 16px;
  border-radius: 8px;
  border: 1px solid #1e293b;
}
canvas {
  margin-top: 20px;
}
.box {
  background:#020617;
  border:1px solid #1e293b;
  padding:14px;
  border-radius:8px;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Bem-vindo ao Meu Saldo Real</h1>

<p>Obrigado por confiar em você e investir neste método.</p>

<p>
Aqui você não vai aprender termos difíceis.<br>
Você só vai descobrir <strong>quanto pode guardar</strong> e <strong>em quanto tempo sua vida começa a mudar</strong>.
</p>

<hr>

<h2>1️⃣ Vamos entender sua realidade</h2>

<label>Quanto dinheiro entra por mês?</label>
<input type="number" id="renda" placeholder="Ex: 2500">

<label>Quanto você gasta com coisas obrigatórias?  
<br><small>(aluguel, contas, mercado, transporte)</small></label>
<input type="number" id="gastos" placeholder="Ex: 1800">

<label>Qual seu objetivo agora?</label>
<select id="objetivo">
  <option value="1000">Guardar R$ 1.000</option>
  <option value="5000">Guardar R$ 5.000</option>
  <option value="10000">Guardar R$ 10.000</option>
</select>

<button onclick="calcular()">Ver meu saldo real</button>

<div class="resultado" id="resultado" style="display:none;"></div>

<canvas id="grafico" width="400" height="200"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
function calcular() {
  const renda = Number(document.getElementById("renda").value);
  const gastos = Number(document.getElementById("gastos").value);
  const objetivo = Number(document.getElementById("objetivo").value);

  if (!renda || !gastos) {
    alert("Preencha os valores para continuar");
    return;
  }

  const sobra = renda - gastos;
  let recomendacaoPercentual = 0.1;

  if (sobra < renda * 0.1) recomendacaoPercentual = 0.05;
  if (sobra > renda * 0.3) recomendacaoPercentual = 0.15;

  const guardar = renda * recomendacaoPercentual;
  const meses = Math.ceil(objetivo / guardar);

  document.getElementById("resultado").style.display = "block";
  document.getElementById("resultado").innerHTML = `
    <div class="box">
      <strong>✔ Recomendação automática</strong><br>
      Com sua realidade atual, o ideal é guardar cerca de <strong>R$ ${guardar.toFixed(2)}</strong> por mês.
    </div>

    <div class="box">
      <strong>✔ Você pode gastar</strong><br>
      Aproximadamente <strong>R$ ${(renda - gastos - guardar).toFixed(2)}</strong> livres no mês.
    </div>

    <div class="box">
      <strong>✔ Tempo para atingir seu objetivo</strong><br>
      Cerca de <strong>${meses} meses</strong>.
    </div>

    <div class="box">
      <strong>Mensagem importante:</strong><br>
      Se hoje parece pouco, lembre-se: constância vence esforço.
    </div>
  `;

  const ctx = document.getElementById('grafico').getContext('2d');
  if (window.graficoSaldo) window.graficoSaldo.destroy();

  window.graficoSaldo = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Guardar por mês', 'Objetivo final'],
      datasets: [{
        data: [guardar, objetivo]
      }]
    },
    options: {
      plugins: { legend: { display: false } }
    }
  });
}
</script>

</body>
</html>
