<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meu Saldo Real • Acompanhamento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #020617;
  color: #e5e7eb;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
}
.card {
  background: #020617;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
h1, h2 {
  color: #38bdf8;
}
label {
  display: block;
  margin-top: 12px;
}
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}
button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  background: #38bdf8;
  color: #020617;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
small {
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>Meu Saldo Real</h1>
<p>Este sistema foi feito para acompanhar sua vida financeira por anos.<br>
Não é sobre perfeição. É sobre constância.</p>
</div>

<div class="card">
<h2>Registrar este mês</h2>

<label>Mês de referência</label>
<input type="month" id="mes">

<label>Quanto dinheiro entrou?</label>
<input type="number" id="entrada">

<label>Quanto dinheiro saiu?</label>
<input type="number" id="saida">

<label>Qual seu grande objetivo financeiro?</label>
<input type="number" id="meta" placeholder="Ex: 50000">

<button onclick="salvarMes()">Salvar mês</button>
</div>

<div class="card">
<h2>Resumo geral</h2>
<div id="resumo"></div>
</div>

<div class="card">
<h2>Evolução ao longo do tempo</h2>
<canvas id="grafico"></canvas>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let dados = JSON.parse(localStorage.getItem("saldoReal")) || [];

function salvarMes() {
  const mes = document.getElementById("mes").value;
  const entrada = Number(document.getElementById("entrada").value);
  const saida = Number(document.getElementById("saida").value);
  const meta = Number(document.getElementById("meta").value);

  if (!mes || !entrada || !saida || !meta) {
    alert("Preencha todos os campos");
    return;
  }

  dados.push({ mes, entrada, saida, saldo: entrada - saida, meta });
  localStorage.setItem("saldoReal", JSON.stringify(dados));

  atualizar();
}

function atualizar() {
  if (dados.length === 0) return;

  const totalGuardado = dados.reduce((acc, d) => acc + d.saldo, 0);
  const ultimaMeta = dados[dados.length - 1].meta;
  const mediaMensal = totalGuardado / dados.length;
  const mesesRestantes = Math.ceil((ultimaMeta - totalGuardado) / mediaMensal);

  document.getElementById("resumo").innerHTML = `
    <p><strong>Total acumulado:</strong> R$ ${totalGuardado.toFixed(2)}</p>
    <p><strong>Média mensal:</strong> R$ ${mediaMensal.toFixed(2)}</p>
    <p><strong>Tempo estimado para atingir meta:</strong> ${mesesRestantes} meses</p>
  `;

  const ctx = document.getElementById("grafico").getContext("2d");
  if (window.grafico) window.grafico.destroy();

  window.grafico = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dados.map(d => d.mes),
      datasets: [{
        label: 'Evolução do saldo',
        data: dados.map(d => d.saldo),
        fill: false
      }]
    }
  });
}

atualizar();
</script>

</body>
</html>
