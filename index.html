<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método Simples para Guardar Dinheiro</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

.container {
  max-width: 480px;
  margin: auto;
  background: #ffffff;
  padding: 20px;
  border-radius: 8px;
}

h1 {
  font-size: 22px;
}

label {
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  background: #2b7cff;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
}

.resultado {
  margin-top: 20px;
  background: #eef3ff;
  padding: 15px;
  border-radius: 6px;
}

.alerta {
  margin-top: 10px;
  color: #c0392b;
  font-weight: bold;
}

.cta {
  margin-top: 25px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
<h1>Descubra quanto você pode gastar e quanto pode guardar todo mês</h1>
<p>Não é falta de dinheiro. É falta de método.</p>

<label>Quanto você ganha por mês?</label>
<input type="number" id="renda" placeholder="Ex: 2500">

<label>Quanto são seus gastos fixos?</label>
<input type="number" id="fixos" placeholder="Aluguel, contas, etc">

<label>Quanto você quer guardar?</label>
<select id="percentual">
  <option value="0.05">5%</option>
  <option value="0.10">10%</option>
  <option value="0.15">15%</option>
</select>

<button onclick="calcular()">Calcular agora</button>

<div class="resultado" id="resultado" style="display:none;"></div>
<div class="alerta" id="alerta"></div>

<div class="cta">
  <a href="https://sl1nk.com/meusaldoreal2026" target="_blank">
    <button>Quero organizar meu dinheiro agora</button>
  </a>
</div>

</div>

<script>
function calcular() {
  const renda = parseFloat(document.getElementById("renda").value);
  const fixos = parseFloat(document.getElementById("fixos").value);
  const percentual = parseFloat(document.getElementById("percentual").value);

  if (!renda || !fixos) {
    alert("Preencha todos os campos");
    return;
  }

  const guardar = renda * percentual;
  const disponivel = renda - fixos - guardar;
  const semanal = disponivel / 4;

  let alerta = "";
  if (fixos > renda * 0.7) {
    alerta = "⚠ Seus gastos fixos estão muito altos. Atenção.";
  }

  document.getElementById("resultado").style.display = "block";
  document.getElementById("resultado").innerHTML = `
    <p><strong>Você deve guardar:</strong> R$ ${guardar.toFixed(2)}</p>
    <p><strong>Você pode gastar no mês:</strong> R$ ${disponivel.toFixed(2)}</p>
    <p><strong>Máximo por semana:</strong> R$ ${semanal.toFixed(2)}</p>
  `;

  document.getElementById("alerta").innerText = alerta;
}
</script>

</body>
</html>
